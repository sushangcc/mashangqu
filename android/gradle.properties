org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 指定 Gradle 使用的 JDK（必须是 8..22，项目要求 17）
# 系统默认 JDK 是 25，Gradle 8.9 不支持，所以固定到本地 JDK 17
org.gradle.java.home=E\:\\AndroidStudio\\jdk17\\jdk-17.0.20+8

# 项目路径含中文（快递码集合），AGP 默认拒绝构建。
# 打开此开关跳过检查：官方警告「可能导致构建失败」，
# 若后续 aapt2/d8 报路径错误，需把项目移到纯英文路径。
android.overridePathCheck=true
